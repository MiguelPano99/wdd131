<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

</head>
<body>
    <div class="container">
        <header>
            Product Review
        </header>

        <form id="reviewForm" class="form-content">
            <div class="form-group">
                <label for="productName">Product Name</label>
                <select id="productName" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                    <option value="productA">Product Alpha</option>
                    <option value="productB">Product Beta</option>
                    <option value="productC">Product Gamma</option>
                </select>
            </div>

            <div class="form-group">
                <label>Overall Rating</label>
                <div class="rating-group">
                    <div class="rating-option">
                        <input type="radio" id="rating1" name="overallRating" value="1" required>
                        <label for="rating1"><span class="star">&#9733;</span>1 Star</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating2" name="overallRating" value="2">
                        <label for="rating2"><span class="star">&#9733;&#9733;</span>2 Stars</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating3" name="overallRating" value="3">
                        <label for="rating3"><span class="star">&#9733;&#9733;&#9733;</span>3 Stars</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating4" name="overallRating" value="4">
                        <label for="rating4"><span class="star">&#9733;&#9733;&#9733;&#9733;</span>4 Stars</label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating5" name="overallRating" value="5">
                        <label for="rating5"><span class="star">&#9733;&#9733;&#9733;&#9733;&#9733;</span>5 Stars</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" placeholder="mm/dd/yyyy" required>
            </div>

            <div class="form-group">
                <label>Which features did you find useful in the product? <br>(Check all that apply)</label>
                <div class="space-y-2 mt-2">
                    <div class="checkbox-group">
                        <input type="checkbox" id="durability" name="features" value="durability">
                        <label for="durability">Durability</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="easeOfUse" name="features" value="easeOfUse">
                        <label for="easeOfUse">Ease of Use</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="performance" name="features" value="performance">
                        <label for="performance">Performance</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="design" name="features" value="design">
                        <label for="design">Design</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="writtenReview">Written Review <span class="optional-text">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview"></textarea>
            </div>

            <div class="form-group">
                <label for="yourName">Your Name <span class="optional-text">(Optional)</span></label>
                <input type="text" id="yourName" name="yourName">
            </div>

            <button type="submit">Post Review</button>
        </form>

        <footer>
            <p>&copy;<span id="currentYear"></span> Miguel Pano Martin</p>
            <p>Last Modification: <span id="lastModified"></span></p>
        </footer>
    </div>


</body>
</html>
