<!DOCTYPE html>
<html lang="en">
<head>

<body>

            <h1 class="logo">Temple Album</h1>
            <nav>

            <figure class="temple-card">

            </figure>

                <img src="images/perth-australia-temple-34994-main.jpg" alt="Perth Australia Temple">
                <figcaption>Perth Australia Temple</figcaption>
            </figure>
        </div>
    </main>
        <footer>
        <div class="container">
            <p>&copy;<span id="currentYear"></span> Miguel Pano Martin <span class="separator">|</span> Mexico</p>
